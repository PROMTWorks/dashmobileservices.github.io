name: Load approved training content

on:
  push:
    branches: [main]
    paths:
      - 'employee-training-content-15-module7.js'
      - '.github/workflows/one-time-load-approved-training.yml'

permissions:
  contents: write

jobs:
  load-approved-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load approved training script in Employee Training Center
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('employee-training-center.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- APPROVED-MODULES-7-11 -->'
          tag = '<script src="employee-training-content-15-module7.js"></script>'
          if marker not in text:
              needle = '</body>'
              if needle not in text:
                  raise SystemExit('Could not find </body> in employee-training-center.html')
              text = text.replace(needle, marker + tag + needle, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: git rm .github/workflows/one-time-load-approved-training.yml

      - name: Commit portal update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add employee-training-center.html
          git commit -m "Load approved Modules 7-11 in employee training portal"
          git push
